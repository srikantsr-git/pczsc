<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/pczsc-logo.png" />
    <link rel="apple-touch-icon" href="/pczsc-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pune City Zonal Sports Committee | PCZSC</title>
    <meta name="description" content="Official portal of Pune City Zonal Sports Committee (PCZSC). Promoting sports excellence, organizing inter-collegiate tournaments, and empowering athletes across Pune." />
    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Critical Theme Pre-paint Initializer -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('pczsc_active_theme');
          if (saved) {
            var theme = JSON.parse(saved);
            if (theme && theme.primaryColors) {
              var root = document.documentElement;
              root.style.setProperty('--color-santic-red', theme.primaryColors.primary || '#D9232D');
              root.style.setProperty('--color-santic-hoverRed', theme.primaryColors.hover || '#B81922');
              if (theme.typography) {
                root.style.setProperty('--font-family-body', theme.typography.bodyFont || 'Inter, sans-serif');
                root.style.setProperty('--font-family-heading', theme.typography.headingFont || 'Inter, sans-serif');
              }
              if (theme.backgroundColors) {
                root.style.setProperty('--color-bg-body', theme.backgroundColors.body || '#FFFFFF');
                root.style.setProperty('--color-bg-card', theme.backgroundColors.card || '#FFFFFF');
              }
            }
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body class="bg-white text-slate-900 antialiased selection:bg-santic-red selection:text-white font-sans overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
